# ==================================
# General Application Settings
# ==================================
app:
  # General application behavior
  connected_notification: true
  notification_time: 2 # Time in seconds
  loop_interval: 1


# ==================================
# Device Settings
# ==================================
device:
  baud_rate: 115200

# ==================================
# System Tray Icon Settings
# ==================================
system_tray:
  # Enable or disable the system tray icon feature
  enabled: true

  # Configuration for the icon image
  icon:
    # Use an absolute or relative path for the icon image.
    # The relative path is recommended for portability.
    path: "" # "C:/Coding/macro_keyboard/Images/pythonIcon.ico"
    relative_path: "Images/pythonIcon.ico" # Path from the project root

# ==================================
# Logging Settings
# ==================================
logging:
  # Enable or disable the logging feature
  enabled: true

  # Set the desired logging level (e.g., DEBUG, INFO, WARNING, ERROR)
  level: DEBUG

  # Configuration for log file storage
  folder:
    # Enable or disable writing logs to a file
    enabled: true
    # The absolute path to the log folder. Overrides relative_path if specified.
    path: "" # "C:/Coding/macro_keyboard/logs"
    # The path to the log folder relative to the project root.
    relative_path: "logs"

# ==================================
# Feature-Specific Toggles
# ==================================
features:
  spotify_auto_start: false
  keyboard_pause_btn: false

# ==================================
# Soundboard Setting
# ==================================
soundboard:
  base_sound_path: "~/Documents/soundboard_audios"
